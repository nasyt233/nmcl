[package]
name = "nmcl"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "0.6"
ureq = "2"
sha1 = "0.10"
unicode-width = "0.1"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"