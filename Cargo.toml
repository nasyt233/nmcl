[package]
name = "nmcl"
version = "0.1.0"
edition = "2021"
description = "A Minecraft Starter Based on Terminal，一个基于终端的Minecraft启动器"
readme = "README.md"
homepage = "https://nasyt.hoha.top"
repository = "https://github.com/nasyt233/nmcl"
license = "MIT OR Apache-2.0"
authors = ["nasyt"]
keywords = ["nmcl", "nasyt", "Minecraft", "game", "starter"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "0.6"
ureq = "2"
sha1 = "0.10"
unicode-width = "0.1"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"